hero:
  enable: true
  weight: 10
  template: hero
  title: natkit
  subtitle: A **NAT instance AMI** for AWS, arm64 and x86_64. [fck-nat](https://github.com/AndrewGuenther/fck-nat)'s features on **LinuxKit**, as an immutable in-memory image.
  ctaButton:
    icon: rocket_launch
    btnText: Get started
    url: /docs/getting-started/
  cta2Button:
    icon: code
    btnText: GitHub
    url: https://github.com/ulm0/natkit
  info: "**Open source**, MIT licensed."

featureGrid:
  enable: true
  weight: 20
  template: feature grid
  title: What you get
  items:
    - title: Immutable
      icon: lock
      description: A minimal kernel, containerd and a handful of service containers, all in memory. No package manager, SSH or SSM agent.
    - title: Highly available
      icon: sync_alt
      description: An Auto Scaling group of one with a static ENI and an EIP. A replacement takes the ENI first, then the EIP.
    - title: NAT64
      icon: swap_horiz
      description: Jool translates 64:ff9b::/96 for IPv6-only subnets, paired with Route 53 Resolver DNS64.
    - title: One YAML file
      icon: description
      description: fck-nat's settings as YAML user-data. One line on the serial console says ready or why not.
    - title: CloudWatch
      icon: monitoring
      description: The CloudWatch agent, pulled by digest at boot only when you enable it.
    - title: OpenTofu module
      icon: deployed_code
      description: tofu/nat sets up the instance, ENI, EIP, routes and a scoped instance role.
