# What natkit-init applies, one `key = value` per line; a key that fails is a failed boot.
# A NAT forwards between interfaces; strict reverse-path filtering would drop traffic from the private subnets
# arriving on a second ENI. IPv6 router advertisements are dhcpcd's (in userspace), so forwarding doesn't stop them.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0
# hardening: no ICMP redirects in or out (natkit-init also clears send_redirects per interface), no source
# routing, SYN cookies, no kernel addresses or log for unprivileged users, no unprivileged BPF
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.tcp_syncookies = 1
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 1
kernel.unprivileged_bpf_disabled = 1
