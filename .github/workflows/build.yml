# Builds natively on GitHub's arm64 and x64 runners, one matrix leg per architecture:
#   jool    Jool's modules for the kernel natkit.yml pins (github.com/ulm0/lk-kernel): jool:<ver>-<key>-<arch>, rebuilt
#           only when that kernel or jool/ changes; on main, the multi-arch jool:<ver> that natkit.yml names
#   image   init image tested against a mock IMDS/EC2/SSM (test/init.sh); out/natkit-<arch>-efi.img as an artifact;
#           init:<sha>, :latest (main), :<tag> (multi-arch)
#   ami     on v* tags or a manual run: a UEFI AMI per arch named natkit-<tag|sha>-<arch>, tagged natkit.io/release
#           (scripts/ami.sh), then the end-to-end boot test (scripts/boot-test.sh), one arch at a time (they share
#           the test subnet's route table), and on arm64 the OpenTofu module's test (scripts/module-test.sh)
#   release on v* tags, once both AMIs pass: the GitHub release
# Repo secret: AWS_ROLE_ARN (GitHub OIDC role; a secret so the account ID stays out of the public logs).
# Repo variables: AWS_REGION, NATKIT_BUCKET, NATKIT_TEST_PUBLIC_SUBNET,
# NATKIT_TEST_PRIVATE_SUBNET, NATKIT_TEST_INSTANCE_PROFILE.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      boot_test:
        description: "Run the EC2 boot test after registering the AMIs (off: just the AMIs, e.g. to boot-test from a laptop)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/ulm0/natkit # what natkit.yml references

jobs:
  jool:
    strategy:
      matrix:
        include:
          - { arch: arm64, runner: ubuntu-26.04-arm }
          - { arch: amd64, runner: ubuntu-26.04 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: key # the kernel's version + a hash of its digest and jool/
        run: |
          kernel=$(sed -n 's|^  image: \(ghcr.io/ulm0/lk-kernel:.*\)$|\1|p' natkit.yml)
          version=$(echo "$kernel" | sed 's|.*:\([0-9.]*\)@.*|\1|')
          hash=$({ echo "$kernel"; cat jool/*; } | sha256sum | cut -c1-12)
          { echo "version=$version"; echo "image=$REGISTRY/jool:$version-$hash-${{ matrix.arch }}"; } >>"$GITHUB_OUTPUT"
      - id: cached
        run: docker manifest inspect "${{ steps.key.outputs.image }}" >/dev/null 2>&1 && echo hit=true >>"$GITHUB_OUTPUT" || true
      - if: steps.cached.outputs.hit != 'true'
        run: |
          make jool
          # the label records the commit that built it (on a PR, its head commit: github.sha is the merge commit)
          echo "FROM $REGISTRY/jool:${{ steps.key.outputs.version }}" | docker build -q -t "${{ steps.key.outputs.image }}" \
            --label org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} -
          # a fork's PR has a read-only token: its modules are only built here, and again in the image job
          [ "${{ github.event.pull_request.head.repo.fork }}" = true ] || docker push "${{ steps.key.outputs.image }}"

  # main: jool:<ver>, multi-arch, moves to this build
  jool-manifest:
    needs: jool
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          kernel=$(sed -n 's|^  image: \(ghcr.io/ulm0/lk-kernel:.*\)$|\1|p' natkit.yml)
          version=$(echo "$kernel" | sed 's|.*:\([0-9.]*\)@.*|\1|')
          hash=$({ echo "$kernel"; cat jool/*; } | sha256sum | cut -c1-12)
          docker buildx imagetools create -t "$REGISTRY/jool:$version" -t "$REGISTRY/jool:$version-$hash" \
            "$REGISTRY/jool:$version-$hash-arm64" "$REGISTRY/jool:$version-$hash-amd64"

  image:
    needs: jool
    strategy:
      matrix:
        include:
          - { arch: arm64, runner: ubuntu-26.04-arm }
          - { arch: amd64, runner: ubuntu-26.04 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: linuxkit-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: linuxkit-${{ runner.arch }}-
      - run: shellcheck -S warning init/natkit-init init/natkit-cwagent jool/jool.sh scripts/*.sh test/init.sh
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make test
      - name: this commit's Jool modules, under the name natkit.yml uses (linuxkit pulls the pinned kernel)
        run: |
          kernel=$(sed -n 's|^  image: \(ghcr.io/ulm0/lk-kernel:.*\)$|\1|p' natkit.yml)
          version=$(echo "$kernel" | sed 's|.*:\([0-9.]*\)@.*|\1|')
          hash=$({ echo "$kernel"; cat jool/*; } | sha256sum | cut -c1-12)
          # not in the registry: a fork's PR that changes the kernel or jool/ (it can't push). Build it here then.
          { docker pull "$REGISTRY/jool:$version-$hash-${{ matrix.arch }}" &&
            docker tag "$REGISTRY/jool:$version-$hash-${{ matrix.arch }}" "$REGISTRY/jool:$version"; } || make jool
      - run: make ARCH=${{ matrix.arch }}
      - run: cd out && sha256sum natkit-${{ matrix.arch }}-efi.img | tee SHA256SUMS-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: natkit-${{ matrix.arch }}-${{ github.sha }}
          path: |
            out/natkit-${{ matrix.arch }}-efi.img
            out/SHA256SUMS-${{ matrix.arch }}
          retention-days: 14
      - if: github.event_name != 'pull_request'
        run: |
          docker tag "$REGISTRY/init:latest" "$REGISTRY/init:${{ github.sha }}-${{ matrix.arch }}"
          docker push "$REGISTRY/init:${{ github.sha }}-${{ matrix.arch }}"

  init-manifest:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -- -t "$REGISTRY/init:${{ github.sha }}"
          [ "${{ github.ref }}" = refs/heads/main ] && set -- "$@" -t "$REGISTRY/init:latest"
          [ "${{ github.ref_type }}" = tag ] && set -- "$@" -t "$REGISTRY/init:${{ github.ref_name }}"
          docker buildx imagetools create "$@" "$REGISTRY/init:${{ github.sha }}-arm64" "$REGISTRY/init:${{ github.sha }}-amd64"

  ami:
    needs: image
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      max-parallel: 1 # both boot tests route the same private subnet through their own ENI
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS_ROLE_ARN
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      NATKIT_BUCKET: ${{ vars.NATKIT_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: natkit-${{ matrix.arch }}-${{ github.sha }}
          path: out
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: ${{ vars.AWS_REGION }}
      - id: ami
        run: |
          name=natkit-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-${{ matrix.arch }}
          ami=$(scripts/ami.sh out/natkit-${{ matrix.arch }}-efi.img ${{ matrix.arch }} "$name" "natkit.io/release=$name")
          echo "ami=$ami" >>"$GITHUB_OUTPUT"
          echo "### AMI \`$ami\` ($name, $AWS_REGION)" >>"$GITHUB_STEP_SUMMARY"
      - name: boot test (EIP, static ENI, client egress, handover, CloudWatch agent)
        if: github.event_name != 'workflow_dispatch' || inputs.boot_test
        run: scripts/boot-test.sh ${{ steps.ami.outputs.ami }} ${{ matrix.arch }}
        env:
          NATKIT_TEST_PUBLIC_SUBNET: ${{ vars.NATKIT_TEST_PUBLIC_SUBNET }}
          NATKIT_TEST_PRIVATE_SUBNET: ${{ vars.NATKIT_TEST_PRIVATE_SUBNET }}
          NATKIT_TEST_INSTANCE_PROFILE: ${{ vars.NATKIT_TEST_INSTANCE_PROFILE }}
          NATKIT_BOOT_TEST_TAG: run-${{ github.run_id }}-${{ matrix.arch }}
      # one architecture: the module and natkit-init's side of it are the same on both
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: matrix.arch == 'arm64' && (github.event_name != 'workflow_dispatch' || inputs.boot_test)
        with:
          tofu_wrapper: false
      - name: module test (handover, conntrack alarm, client_cidrs, untracked)
        if: matrix.arch == 'arm64' && (github.event_name != 'workflow_dispatch' || inputs.boot_test)
        run: scripts/module-test.sh ${{ steps.ami.outputs.ami }} ${{ matrix.arch }}
        env:
          NATKIT_TEST_PUBLIC_SUBNET: ${{ vars.NATKIT_TEST_PUBLIC_SUBNET }}
          NATKIT_TEST_PRIVATE_SUBNET: ${{ vars.NATKIT_TEST_PRIVATE_SUBNET }}
          NATKIT_TEST_INSTANCE_PROFILE: ${{ vars.NATKIT_TEST_INSTANCE_PROFILE }}
          NATKIT_MODULE_TEST_TAG: run-${{ github.run_id }}

  # the boot test's trap doesn't run if the job is cancelled or the runner dies: remove its resources by tag regardless
  boot-cleanup:
    needs: ami
    if: always() && needs.ami.result != 'skipped' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: ${{ vars.AWS_REGION }}
      - run: |
          tag="Name=tag:natkit.io/boot-test,Values=run-${{ github.run_id }}-arm64,run-${{ github.run_id }}-amd64"
          ids=$(aws ec2 describe-instances --output text --query 'Reservations[].Instances[].InstanceId' \
            --filters "$tag" Name=instance-state-name,Values=pending,running,stopping,stopped,shutting-down)
          if [ -n "$ids" ]; then
            echo "terminating $ids"
            aws ec2 terminate-instances --instance-ids $ids >/dev/null
            aws ec2 wait instance-terminated --instance-ids $ids
          fi
          for e in $(aws ec2 describe-network-interfaces --output text --query 'NetworkInterfaces[].NetworkInterfaceId' --filters "$tag"); do
            echo "deleting $e"
            aws ec2 delete-network-interface --network-interface-id "$e"
          done
          for a in $(aws ec2 describe-addresses --output text --query 'Addresses[].AllocationId' --filters "$tag"); do
            echo "releasing $a"
            aws ec2 release-address --allocation-id "$a"
          done
          for arch in arm64 amd64; do
            aws ssm delete-parameter --name "/natkit/boot-test/run-${{ github.run_id }}-$arch/cwagent" 2>/dev/null || true
          done
      # the module test's state is still there only if its own destroy didn't run or didn't finish
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - name: destroy what the module test left
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          NATKIT_BUCKET: ${{ vars.NATKIT_BUCKET }}
          TF_VAR_arch: arm64
          TF_VAR_tag: run-${{ github.run_id }}
          TF_VAR_public_subnet: ${{ vars.NATKIT_TEST_PUBLIC_SUBNET }}
          TF_VAR_private_subnet: ${{ vars.NATKIT_TEST_PRIVATE_SUBNET }}
          TF_VAR_instance_profile: ${{ vars.NATKIT_TEST_INSTANCE_PROFILE }}
        run: |
          key=module-test/run-${{ github.run_id }}.tfstate
          aws s3api head-object --bucket "$NATKIT_BUCKET" --key "$key" >/dev/null 2>&1 || exit 0
          name=natkit-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-arm64
          TF_VAR_ami_id=$(aws ec2 describe-images --owners self --filters "Name=name,Values=$name" --query 'Images[0].ImageId' --output text)
          export TF_VAR_ami_id
          tofu -chdir=test/module init -input=false -backend-config="bucket=$NATKIT_BUCKET" -backend-config="key=$key" -backend-config="region=$AWS_REGION"
          tofu -chdir=test/module destroy -input=false -auto-approve
          aws s3 rm "s3://$NATKIT_BUCKET/$key"
      # only release (natkit-v*) AMIs are kept; a manual run without the boot test keeps its own AMIs for testing by hand
      - name: prune per-commit AMIs
        env:
          KEEP: ${{ github.event_name == 'workflow_dispatch' && !inputs.boot_test && format('natkit-{0}-', github.sha) || 'none' }}
        run: |
          aws ec2 describe-images --owners self --output text --filters Name=tag-key,Values=natkit.io/release \
            --query 'Images[].[ImageId,Name]' | while read -r ami name; do
            case $name in natkit-v* | "$KEEP"*) continue ;; esac
            echo "deregistering $ami ($name) and its snapshots"
            aws ec2 deregister-image --image-id "$ami" --delete-associated-snapshots >/dev/null
          done

  release:
    needs: [jool, ami]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: natkit-*-${{ github.sha }}
          path: out
          merge-multiple: true
      - run: |
          version=$(sed -n 's|^  image: ghcr.io/ulm0/lk-kernel:\([0-9.]*\)@.*$|\1|p' natkit.yml)
          prev=$(gh release list --json tagName --jq "[.[].tagName | select(. != \"$TAG\")][0] // empty")
          {
            for arch in arm64 amd64; do
              ami=$(aws ec2 describe-images --owners self --filters "Name=name,Values=natkit-$TAG-$arch" --query 'Images[0].ImageId' --output text)
              echo "- $arch: AMI \`$ami\` (natkit-$TAG-$arch, ${{ vars.AWS_REGION }}, private) or import \`natkit-$TAG-$arch-efi.img.gz\` below"
            done
            echo
            echo "Kernel $version, boot-tested (EIP, static ENI handover, NAT64 module, CloudWatch agent)."
            echo
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" ${prev:+-f previous_tag_name="$prev"} --jq .body
          } >notes.md
          gh release edit "$TAG" --notes-file notes.md 2>/dev/null ||
            gh release create "$TAG" --title "$TAG" --verify-tag --notes-file notes.md
          # the AMIs are private to this account: the disk images are what anyone else imports (scripts/ami.sh)
          for arch in arm64 amd64; do gzip -9 <"out/natkit-$arch-efi.img" >"natkit-$TAG-$arch-efi.img.gz"; done
          sha256sum natkit-"$TAG"-*-efi.img.gz >SHA256SUMS
          gh release upload "$TAG" --clobber natkit-"$TAG"-*-efi.img.gz SHA256SUMS
