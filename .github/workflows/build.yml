# Builds natively on GitHub's arm64 and x64 runners, one matrix leg per architecture:
#   jool    Jool's modules for the kernel natkit.yml pins (github.com/ulm0/lk-kernel): jool:<ver>-<key>-<arch>, rebuilt
#           only when that kernel or jool/ changes; on main, the multi-arch jool:<ver> that natkit.yml names
#   image   init image (natkit, the Go binary) tested against a mock IMDS/EC2/SSM/Auto Scaling/CloudWatch
#           (test/init.sh); out/natkit-<arch>-efi.img as an artifact;
#           init:<sha>, :latest (main), :<tag> (multi-arch)
#   go      natkit's Go code (init/): gofmt, go vet, unit tests with the race detector, govulncheck, the user-data
#           parser fuzzed
#   tofu    the OpenTofu configurations are formatted and valid (tofu/nat itself only runs on tags, in the module test)
#   ami     on v* tags or a manual run: a UEFI AMI per arch named natkit-<tag|sha>-<arch>, tagged natkit.io/release
#           (scripts/ami.sh), then the end-to-end boot test (scripts/boot-test.sh), one arch at a time (they share
#           the test subnet's route table), and on arm64 the OpenTofu module's test (scripts/module-test.sh)
#   release on v* tags, once both AMIs pass: the AMIs are made public (launch permission for all accounts, in
#           AWS_REGION only), the GitHub release; a published release's AMIs are never deregistered, only those of a
#           lower release that never went public (its tests failed)
# Repo secret: AWS_ROLE_ARN (GitHub OIDC role; a secret so the account ID stays out of the public logs).
# Repo variables: AWS_REGION, NATKIT_BUCKET, NATKIT_TEST_PUBLIC_SUBNET,
# NATKIT_TEST_PRIVATE_SUBNET, NATKIT_TEST_INSTANCE_PROFILE.
name: build

# not for a change to the docs alone (docs.yml): tags always run, path filters don't apply to them
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
    inputs:
      boot_test:
        description: "Run the EC2 boot test after registering the AMIs (off: just the AMIs, e.g. to boot-test from a laptop)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/ulm0/natkit # what natkit.yml references

jobs:
  jool:
    strategy:
      matrix:
        include:
          - { arch: arm64, runner: ubuntu-26.04-arm }
          - { arch: amd64, runner: ubuntu-26.04 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: key # the kernel's version + a hash of its digest and jool/
        run: |
          kernel=$(sed -n 's|^  image: \(ghcr.io/ulm0/lk-kernel:.*\)$|\1|p' natkit.yml)
          version=$(echo "$kernel" | sed 's|.*:\([0-9.]*\)@.*|\1|')
          hash=$({ echo "$kernel"; cat jool/*; } | sha256sum | cut -c1-12)
          { echo "version=$version"; echo "image=$REGISTRY/jool:$version-$hash-${{ matrix.arch }}"; } >>"$GITHUB_OUTPUT"
      - id: cached
        run: docker manifest inspect "${{ steps.key.outputs.image }}" >/dev/null 2>&1 && echo hit=true >>"$GITHUB_OUTPUT" || true
      - if: steps.cached.outputs.hit != 'true'
        run: |
          make jool
          # the label records the commit that built it (on a PR, its head commit: github.sha is the merge commit)
          echo "FROM $REGISTRY/jool:${{ steps.key.outputs.version }}" | docker build -q -t "${{ steps.key.outputs.image }}" \
            --label org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} -
          # a fork's PR has a read-only token: its modules are only built here, and again in the image job
          [ "${{ github.event.pull_request.head.repo.fork }}" = true ] || docker push "${{ steps.key.outputs.image }}"

  # main: jool:<ver>, multi-arch, moves to this build
  jool-manifest:
    needs: jool
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          kernel=$(sed -n 's|^  image: \(ghcr.io/ulm0/lk-kernel:.*\)$|\1|p' natkit.yml)
          version=$(echo "$kernel" | sed 's|.*:\([0-9.]*\)@.*|\1|')
          hash=$({ echo "$kernel"; cat jool/*; } | sha256sum | cut -c1-12)
          docker buildx imagetools create -t "$REGISTRY/jool:$version" -t "$REGISTRY/jool:$version-$hash" \
            "$REGISTRY/jool:$version-$hash-arm64" "$REGISTRY/jool:$version-$hash-amd64"

  image:
    needs: jool
    strategy:
      matrix:
        include:
          - { arch: arm64, runner: ubuntu-26.04-arm }
          - { arch: amd64, runner: ubuntu-26.04 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: linuxkit-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: linuxkit-${{ runner.arch }}-
      - run: shellcheck -S warning jool/jool.sh scripts/*.sh scripts/initramfs-init test/init.sh test/ethtool
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: test/init.sh # the image against the mock; the Go unit tests are the go job's
      - name: this commit's Jool modules, under the name natkit.yml uses (linuxkit pulls the pinned kernel)
        run: |
          kernel=$(sed -n 's|^  image: \(ghcr.io/ulm0/lk-kernel:.*\)$|\1|p' natkit.yml)
          version=$(echo "$kernel" | sed 's|.*:\([0-9.]*\)@.*|\1|')
          hash=$({ echo "$kernel"; cat jool/*; } | sha256sum | cut -c1-12)
          # not in the registry: a fork's PR that changes the kernel or jool/ (it can't push). Build it here then.
          { docker pull "$REGISTRY/jool:$version-$hash-${{ matrix.arch }}" &&
            docker tag "$REGISTRY/jool:$version-$hash-${{ matrix.arch }}" "$REGISTRY/jool:$version"; } || make jool
      - run: make ARCH=${{ matrix.arch }}
      - run: cd out && sha256sum natkit-${{ matrix.arch }}-efi.img | tee SHA256SUMS-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: natkit-${{ matrix.arch }}-${{ github.sha }}
          path: |
            out/natkit-${{ matrix.arch }}-efi.img
            out/SHA256SUMS-${{ matrix.arch }}
          retention-days: 14
      - if: github.event_name != 'pull_request'
        run: |
          docker tag "$REGISTRY/init:latest" "$REGISTRY/init:${{ github.sha }}-${{ matrix.arch }}"
          docker push "$REGISTRY/init:${{ github.sha }}-${{ matrix.arch }}"

  init-manifest:
    needs: [image, go] # init:latest and init:<tag> only once the Go code's checks passed too
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -- -t "$REGISTRY/init:${{ github.sha }}"
          [ "${{ github.ref }}" = refs/heads/main ] && set -- "$@" -t "$REGISTRY/init:latest"
          [ "${{ github.ref_type }}" = tag ] && set -- "$@" -t "$REGISTRY/init:${{ github.ref_name }}"
          docker buildx imagetools create "$@" "$REGISTRY/init:${{ github.sha }}-arm64" "$REGISTRY/init:${{ github.sha }}-amd64"

  tofu:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - run: |
          tofu fmt -check -recursive -diff tofu test/module examples
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/tofu-plugins" && mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for d in tofu/nat tofu/ci test/module examples/vpc; do
            tofu -chdir="$d" init -backend=false -input=false >/dev/null
            tofu -chdir="$d" validate
          done

  # natkit's Go code (init/): formatted, vetted, its unit tests with the race detector, the user-data parser fuzzed,
  # and built for both architectures. test/init.sh (the image job's make test) runs the binary against the mock.
  go:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: init/go.mod
          cache-dependency-path: init/go.sum
      - name: formatted and vetted
        run: test -z "$(gofmt -l .)" && go vet ./...
      - name: unit tests, with the race detector
        run: go test -count=1 -race -coverprofile=cover.out ./... && go tool cover -func=cover.out | tail -n 1
      # known vulnerabilities in what natkit calls (its dependencies and Go's library), from vuln.go.dev: a new one
      # fails the next run, which is the notice to update
      - name: no known vulnerability in the code natkit calls
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: the user-data parser, fuzzed
        run: go test -run '^$' -fuzz FuzzUserData -fuzztime 60s .
      - name: built for both architectures
        run: for a in arm64 amd64; do CGO_ENABLED=0 GOOS=linux GOARCH=$a go build -o /dev/null .; done

  ami:
    needs: [image, tofu, go]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      max-parallel: 1 # both boot tests route the same private subnet through their own ENI
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS_ROLE_ARN
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      NATKIT_BUCKET: ${{ vars.NATKIT_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: natkit-${{ matrix.arch }}-${{ github.sha }}
          path: out
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: ${{ vars.AWS_REGION }}
      - id: ami
        run: |
          version=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          name=natkit-$version-${{ matrix.arch }}
          # ec2:SharedTag/: visible to every account the AMI is shared with (public, for a release), to find it by tag
          # and to trace it to its commit
          ami=$(scripts/ami.sh out/natkit-${{ matrix.arch }}-efi.img ${{ matrix.arch }} "$name" "natkit.io/release=$name" \
            "ec2:SharedTag/natkit.io/version=$version" "ec2:SharedTag/natkit.io/arch=${{ matrix.arch }}" \
            "ec2:SharedTag/natkit.io/commit=${{ github.sha }}")
          echo "ami=$ami" >>"$GITHUB_OUTPUT"
          echo "### AMI \`$ami\` ($name, $AWS_REGION)" >>"$GITHUB_STEP_SUMMARY"
      - name: boot test (EIP, static ENI, client egress, handover, CloudWatch agent)
        if: github.event_name != 'workflow_dispatch' || inputs.boot_test
        run: scripts/boot-test.sh ${{ steps.ami.outputs.ami }} ${{ matrix.arch }}
        env:
          NATKIT_TEST_PUBLIC_SUBNET: ${{ vars.NATKIT_TEST_PUBLIC_SUBNET }}
          NATKIT_TEST_PRIVATE_SUBNET: ${{ vars.NATKIT_TEST_PRIVATE_SUBNET }}
          NATKIT_TEST_INSTANCE_PROFILE: ${{ vars.NATKIT_TEST_INSTANCE_PROFILE }}
          NATKIT_BOOT_TEST_TAG: run-${{ github.run_id }}-${{ matrix.arch }}
      # one architecture: the module and natkit-init's side of it are the same on both
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: matrix.arch == 'arm64' && (github.event_name != 'workflow_dispatch' || inputs.boot_test)
        with:
          tofu_wrapper: false
      - name: module test (handover, conntrack alarm, client_cidrs, untracked)
        if: matrix.arch == 'arm64' && (github.event_name != 'workflow_dispatch' || inputs.boot_test)
        run: scripts/module-test.sh ${{ steps.ami.outputs.ami }} ${{ matrix.arch }}
        env:
          NATKIT_TEST_PUBLIC_SUBNET: ${{ vars.NATKIT_TEST_PUBLIC_SUBNET }}
          NATKIT_TEST_PRIVATE_SUBNET: ${{ vars.NATKIT_TEST_PRIVATE_SUBNET }}
          NATKIT_TEST_INSTANCE_PROFILE: ${{ vars.NATKIT_TEST_INSTANCE_PROFILE }}
          NATKIT_MODULE_TEST_TAG: run-${{ github.run_id }}

  # the boot test's trap doesn't run if the job is cancelled or the runner dies: remove its resources by tag regardless
  boot-cleanup:
    needs: ami
    if: always() && needs.ami.result != 'skipped' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: ${{ vars.AWS_REGION }}
      - run: |
          tag="Name=tag:natkit.io/boot-test,Values=run-${{ github.run_id }}-arm64,run-${{ github.run_id }}-amd64"
          ids=$(aws ec2 describe-instances --output text --query 'Reservations[].Instances[].InstanceId' \
            --filters "$tag" Name=instance-state-name,Values=pending,running,stopping,stopped,shutting-down)
          if [ -n "$ids" ]; then
            echo "terminating $ids"
            aws ec2 terminate-instances --instance-ids $ids >/dev/null
            aws ec2 wait instance-terminated --instance-ids $ids
          fi
          for e in $(aws ec2 describe-network-interfaces --output text --query 'NetworkInterfaces[].NetworkInterfaceId' --filters "$tag"); do
            # its routes first: one left behind would keep every later test waiting for the route table
            for t in $(aws ec2 describe-route-tables --output text --query 'RouteTables[].RouteTableId' --filters "Name=route.network-interface-id,Values=$e"); do
              for d in $(aws ec2 describe-route-tables --route-table-ids "$t" --output text \
                --query "RouteTables[0].Routes[?NetworkInterfaceId=='$e'].[DestinationCidrBlock || DestinationIpv6CidrBlock]"); do
                echo "deleting $t's route to $d"
                case $d in
                  *:*) aws ec2 delete-route --route-table-id "$t" --destination-ipv6-cidr-block "$d" ;;
                  *) aws ec2 delete-route --route-table-id "$t" --destination-cidr-block "$d" ;;
                esac
              done
            done
            echo "deleting $e"
            aws ec2 delete-network-interface --network-interface-id "$e"
          done
          for a in $(aws ec2 describe-addresses --output text --query 'Addresses[].AllocationId' --filters "$tag"); do
            echo "releasing $a"
            aws ec2 release-address --allocation-id "$a"
          done
          for arch in arm64 amd64; do
            aws ssm delete-parameter --name "/natkit/boot-test/run-${{ github.run_id }}-$arch/cwagent" 2>/dev/null || true
          done
      # the module test's state is still there only if its own destroy didn't run or didn't finish
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - name: destroy what the module test left
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          NATKIT_BUCKET: ${{ vars.NATKIT_BUCKET }}
          TF_VAR_arch: arm64
          TF_VAR_tag: run-${{ github.run_id }}
          TF_VAR_public_subnet: ${{ vars.NATKIT_TEST_PUBLIC_SUBNET }}
          TF_VAR_private_subnet: ${{ vars.NATKIT_TEST_PRIVATE_SUBNET }}
          TF_VAR_instance_profile: ${{ vars.NATKIT_TEST_INSTANCE_PROFILE }}
        run: |
          key=module-test/run-${{ github.run_id }}.tfstate
          aws s3api head-object --bucket "$NATKIT_BUCKET" --key "$key" >/dev/null 2>&1 || exit 0
          name=natkit-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-arm64
          TF_VAR_ami_id=$(aws ec2 describe-images --owners self --filters "Name=name,Values=$name" --query 'Images[0].ImageId' --output text)
          export TF_VAR_ami_id
          tofu -chdir=test/module init -input=false -backend-config="bucket=$NATKIT_BUCKET" -backend-config="key=$key" -backend-config="region=$AWS_REGION"
          tofu -chdir=test/module destroy -input=false -auto-approve
          aws s3 rm "s3://$NATKIT_BUCKET/$key"
      # only release (natkit-v*) AMIs are kept; a manual run without the boot test keeps its own AMIs for testing by hand
      - name: prune per-commit AMIs
        env:
          KEEP: ${{ github.event_name == 'workflow_dispatch' && !inputs.boot_test && format('natkit-{0}-', github.sha) || 'none' }}
        run: |
          aws ec2 describe-images --owners self --output text --filters Name=tag-key,Values=natkit.io/release \
            --query 'Images[].[ImageId,Name]' | while read -r ami name; do
            case $name in natkit-v* | "$KEEP"*) continue ;; esac
            echo "deregistering $ami ($name) and its snapshots"
            aws ec2 deregister-image --image-id "$ami" --delete-associated-snapshots >/dev/null
          done

  release:
    needs: [jool, ami]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: natkit-*-${{ github.sha }}
          path: out
          merge-multiple: true
      # Only this job, after both boot tests, and only a release's AMIs (the role's ModifyImageAttribute needs
      # natkit.io/release=natkit-v*). The account blocks public AMIs (block-new-sharing): unblocked for the two calls
      # and blocked again on the way out, pass or fail. Blocking again leaves the AMIs already public as they are.
      - name: the AMIs, public
        run: |
          state=$(aws ec2 get-image-block-public-access-state --query ImageBlockPublicAccessState --output text)
          if [ "$state" != unblocked ]; then
            trap 'aws ec2 enable-image-block-public-access --image-block-public-access-state block-new-sharing >/dev/null' EXIT
            aws ec2 disable-image-block-public-access >/dev/null
          fi
          for arch in arm64 amd64; do
            ami=$(aws ec2 describe-images --owners self --filters "Name=name,Values=natkit-$TAG-$arch" --query 'Images[0].ImageId' --output text)
            # the unblock can take a moment to apply: tried for up to 5 min
            for i in $(seq 30); do
              aws ec2 modify-image-attribute --image-id "$ami" --launch-permission 'Add=[{Group=all}]' && break
              [ "$i" = 30 ] && exit 1
              sleep 10
            done
            [ "$(aws ec2 describe-images --image-ids "$ami" --query 'Images[0].Public' --output text)" = True ]
            echo "$ami (natkit-$TAG-$arch) is public"
          done
      - run: |
          version=$(sed -n 's|^  image: ghcr.io/ulm0/lk-kernel:\([0-9.]*\)@.*$|\1|p' natkit.yml)
          prev=$(gh release list --json tagName --jq "[.[].tagName | select(. != \"$TAG\")][0] // empty")
          owner=$(aws ec2 describe-images --owners self --filters "Name=name,Values=natkit-$TAG-arm64" --query 'Images[0].OwnerId' --output text)
          {
            echo "Public AMIs in ${{ vars.AWS_REGION }}, owner \`$owner\`:"
            echo
            for arch in arm64 amd64; do
              ami=$(aws ec2 describe-images --owners self --filters "Name=name,Values=natkit-$TAG-$arch" --query 'Images[0].ImageId' --output text)
              echo "- $arch: \`$ami\` (natkit-$TAG-$arch)"
            done
            echo
            echo "In any other Region, import the disk image below (\`scripts/ami.sh\`). A release's AMIs are never removed; AWS deprecates them after two years: see [Upgrading](https://natkit.ulm0.com/docs/deploy/upgrading/#how-long-an-ami-stays-up)."
            echo
            echo "Kernel $version, boot-tested (EIP, static ENI handover, NAT64 module, CloudWatch agent)."
            echo
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" ${prev:+-f previous_tag_name="$prev"} --jq .body
          } >notes.md
          gh release edit "$TAG" --notes-file notes.md 2>/dev/null ||
            gh release create "$TAG" --title "$TAG" --verify-tag --notes-file notes.md
          # the AMIs are private to this account: the disk images are what anyone else imports (scripts/ami.sh)
          for arch in arm64 amd64; do gzip -9 <"out/natkit-$arch-efi.img" >"natkit-$TAG-$arch-efi.img.gz"; done
          sha256sum natkit-"$TAG"-*-efi.img.gz >SHA256SUMS
          gh release upload "$TAG" --clobber natkit-"$TAG"-*-efi.img.gz SHA256SUMS
      # A published release's AMIs stay for good: launch templates and Auto Scaling groups name them, by ID or by name
      # and owner, and a replacement must find them. Only a lower release's that never went public (its tests failed,
      # as v0.1.4's) go: nobody can launch those.
      - name: prune lower releases that were never published
        run: |
          aws ec2 describe-images --owners self --output text --filters Name=tag-key,Values=natkit.io/release \
            --query 'Images[].[ImageId,Name,Public]' | while read -r ami name public; do
            case $name in natkit-v*-arm64 | natkit-v*-amd64) ;; *) continue ;; esac
            [ "$public" = False ] || continue
            v=${name#natkit-} && v=${v%-*}
            [ "$v" != "$TAG" ] && [ "$(printf '%s\n%s\n' "$v" "$TAG" | sort -V | head -n 1)" = "$v" ] || continue
            echo "deregistering $ami ($name, never published) and its snapshots"
            aws ec2 deregister-image --image-id "$ami" --delete-associated-snapshots >/dev/null
          done
