name: docs

on:
  push:
    branches: [main]
    paths: [docs/**, tofu/nat/**, examples/**, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, tofu/nat/**, examples/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.169.0

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # enableGitInfo: last-modified dates
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: docs/go.mod
          cache: false
      - run: |
          curl -fsSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      # the pages terraform-docs writes: tofu/nat's Inputs and Outputs, and examples/vpc
      - name: the OpenTofu module page's Inputs and Outputs match tofu/nat (terraform-docs tofu/nat writes them)
        uses: docker://quay.io/terraform-docs/terraform-docs:0.25.1@sha256:7b2a74a2b9a9e6af41200335da47b73a64c39a0edd5afb91bc921f0a77eae681
        with:
          args: --output-check tofu/nat
      - name: the VPC module page's example is examples/vpc (terraform-docs examples/vpc writes it)
        uses: docker://quay.io/terraform-docs/terraform-docs:0.25.1@sha256:7b2a74a2b9a9e6af41200335da47b73a64c39a0edd5afb91bc921f0a77eae681
        with:
          args: --output-check examples/vpc
      - run: hugo --minify --source docs
      - name: every link between the site's pages, and its anchor, exists
        run: python3 docs/check-links.py docs/public
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
